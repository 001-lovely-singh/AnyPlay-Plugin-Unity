name: Build AnyPlay Unity Plugin

# A build does NOT run on every push. It runs only:
#   1) on a tag push:  git tag v1.0.0 && git push origin v1.0.0
#   2) manually: Actions tab > "Build AnyPlay Unity Plugin" > Run workflow (enter a tag name)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The signing key lives in GitHub Secrets (never in the repo).
      # Put the SAME keystore secrets as the main app / RGSS plugin here too.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANYPLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/anyplay-release.keystore"
            echo "ANYPLAY_KEYSTORE_FILE=$RUNNER_TEMP/anyplay-release.keystore" >> "$GITHUB_ENV"
            echo "ANYPLAY_STORE_PASSWORD=${{ secrets.ANYPLAY_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANYPLAY_KEY_ALIAS=${{ secrets.ANYPLAY_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANYPLAY_KEY_PASSWORD=${{ secrets.ANYPLAY_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found: the APK will be signed with a temporary debug key."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          find app/build/outputs/apk/release -name "*.apk"
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" AnyPlay-Unity-Plugin.apk
          echo "APK_PATH=AnyPlay-Unity-Plugin.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyPlay-Unity-Plugin
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "AnyPlay Unity Plugin ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
