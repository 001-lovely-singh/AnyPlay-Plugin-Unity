apply plugin: 'com.android.application'

android {
    namespace 'com.winlator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.anyplay.unityplugin'
        minSdkVersion 26
        targetSdkVersion 28
        // Every CI build gets a higher versionCode, so a new APK installs over the old one.
        versionCode System.getenv("GITHUB_RUN_NUMBER") ? 1000 + System.getenv("GITHUB_RUN_NUMBER").toInteger() : 33
        versionName "11.2"
    }

    signingConfigs {
        release {
            def ksFile = System.getenv("ANYPLAY_KEYSTORE_FILE")
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv("ANYPLAY_STORE_PASSWORD")
                keyAlias System.getenv("ANYPLAY_KEY_ALIAS")
                keyPassword System.getenv("ANYPLAY_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Uses the release keystore from the GitHub secrets; falls back to the debug key (a different key on every CI run).
            signingConfig System.getenv("ANYPLAY_KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug

            ndk {
                abiFilters 'arm64-v8a'
            }
        }

        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.12'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'
}
